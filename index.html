<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Thanks for coming in — The Frog &amp; British Library</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0F2119">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Libre+Caslon+Display&family=Karla:wght@400;500;600&display=swap">
<link rel="stylesheet" href="/css/styles.css">
</head>
<body>
<main class="card">
  <p class="eyebrow">Tolbiac &middot; Paris 13e</p>
  <hr class="rule">

  <h1 class="title">Thanks for coming in.</h1>
  <p class="subtitle">Hope the terrace treated you well.</p>

  <button type="button" class="badge" id="badge" aria-describedby="hint">
    <span class="badge__role" id="role">Served you today</span>
    <span class="badge__name" id="name">Sam</span>
  </button>
  <p class="hint" id="hint" role="status">Tap the badge to copy the name</p>

  <p class="note">
    A review that names <strong class="note__name" id="name-inline">Sam</strong>
    tells the pub who actually looked after you &mdash; and it lands where it should.
  </p>

  <button type="button" class="cta" id="go">Write a Google review</button>
  <p class="foot">Good night or bad, both are worth writing.</p>

  <p class="venue">The Frog &amp; British Library</p>
</main>

<script src="/js/config.js"></script>
<script src="/js/app.js"></script>
</body>
</html>
